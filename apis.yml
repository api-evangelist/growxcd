name: GrowXCD
description: 'GrowXCD (GrowXCD Finance Private Limited) is an RBI-registered Non-Banking Financial
  Company (NBFC) headquartered in Chennai, India, focused on accelerating business growth for the
  small businesses and self-employed customers that form the backbone of India''s economy. Its
  lending products include Grow Shubam small-ticket mortgage loans, Loan Against Property (LAP)
  secured lending, and unsecured loans up to Rs 25 lakh with tenures of 12 to 60 months, delivered
  through a minimal-documentation digital process with swift approvals and repayment via eMandate or
  NACH auto-debit. GrowXCD is a portfolio company of Prosus Ventures. It publishes a consumer website
  and statutory policy documents but does not currently expose a public developer portal, API, or SDKs.'
